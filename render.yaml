services:
  - type: web
    name: runqapp
    env: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rundaappkai-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      # 0 はワーカーを分けない単一モード。今の利用者数なら十分で、
      # メモリも節約できる。1 にするとクラスターモードのままワーカーが
      # 1つだけという中途半端な状態になり、親プロセスの分だけ無駄になる。
      # 同時アクセスが増えてきたら 2 以上に上げる。
      - key: WEB_CONCURRENCY
        value: "0"

databases:
  - name: rundaappkai-db
    databaseName: rundaappkai_production
    user: rundaappkai
