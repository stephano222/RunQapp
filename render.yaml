services:
  - type: web
    name: runqapp
    env: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rundaappkai-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      # 0 にするとワーカーを分けない単一モードで動く。
      # 1 だとクラスターモードのままワーカーが1つだけという中途半端な状態になり、
      # 親プロセスの分だけメモリを余計に使う。512MBの枠では単一モードが適している。
      - key: WEB_CONCURRENCY
        value: "0"

databases:
  - name: rundaappkai-db
    databaseName: rundaappkai_production
    user: rundaappkai
