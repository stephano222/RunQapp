services:
  - type: web
    name: runqapp
    env: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rundaappkai-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      # 無料プラン(512MB)ではワーカー1つのほうが起動が速くメモリも安定する
      - key: WEB_CONCURRENCY
        value: "1"

databases:
  - name: rundaappkai-db
    databaseName: rundaappkai_production
    user: rundaappkai
